<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — MoodMap</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#1a1450,#06061a);color:#fff;font-family:'M PLUS Rounded 1c',-apple-system,sans-serif;text-align:center;padding:20px}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff8fcf 25%,#7b6cff 60%,#4fd6ff);box-shadow:0 0 80px rgba(255,143,207,.6),0 0 160px rgba(123,108,255,.5);margin-bottom:24px;animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.08)}}
h1{font-size:28px;margin:0 0 8px;background:linear-gradient(120deg,#fff,#ff8fcf,#4fd6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#c8c3e8;margin:0 0 24px}
a{color:#ff8fcf;text-decoration:none;border:1px solid rgba(255,143,207,.4);padding:10px 20px;border-radius:999px;font-weight:700}
a:hover{background:rgba(255,143,207,.12)}
</style>
</head>
<body>

<h1>迷子の星</h1>
